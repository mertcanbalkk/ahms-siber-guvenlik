name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check tracked files
        run: python scripts/check_public_files.py
      - run: npm ci
      - run: python -m pip install -r requirements-lock.txt
      - name: Node.js unit tests
        run: npm test
      - name: Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
